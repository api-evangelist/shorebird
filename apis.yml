aid: shorebird
name: Shorebird
description: >-
  Shorebird is a code push (over-the-air update) service for Flutter apps that
  lets teams ship Dart code and asset fixes straight to users' devices in
  minutes, without waiting for App Store or Play Store review. It works across
  Android, iOS, macOS, Linux, and Windows and is driven by the Shorebird CLI and
  a web console, with staging tracks, percentage-based rollouts, instant
  rollback, and signed patches. Shorebird also offers Shorebird CI for automated
  Flutter builds and releases. The service is CLI/console-first (no public REST
  OpenAPI) and is backed by Accel.
